name: nexxchat_firebase
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.0.0
  
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase - Harmonisierte Versionen (Wichtig für V1 Cloud Messaging)
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.2.0

  flutter_webrtc:
    git:
      url: https://github.com/flutter-webrtc/flutter-webrtc.git
      ref: main

  permission_handler: ^12.0.1
  provider: ^6.0.5 
  # Benachrichtigungen & Auth
  flutter_local_notifications: ^18.0.1
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  
  # Weitere Tools
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  modal_progress_hud_nsn: ^0.5.1
  webview_flutter: ^4.0.7
  image_picker: ^1.1.2
  image: ^4.3.0
  intl: ^0.20.2
  flame: ^1.18.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

l10n:
  arb-dir: lib/apps/flutter-tetris/l10n
  template-arb-file: intl_en.arb
  output-dir: lib/apps/flutter-tetris/generated
  output-localization-file: l10n.dart
  output-class: S
  synthetic-package: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - images/nexxchat.png
    - assets/material.png
    - assets/wechat.png
    - assets/alipay.jpg
    - assets/audios/
    - assets/