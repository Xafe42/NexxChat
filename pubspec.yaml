name: nexxchat_firebase
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase (compatible versions)
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # Media & Utils
  image_picker: ^1.1.1
  image: ^4.1.1
  path: ^1.8.3
  intl: ^0.20.2
  audioplayers: ^6.0.0
  flame: ^1.4.0
  http: ^1.1.0

  # App Tools
  shared_preferences: ^2.5.3
  modal_progress_hud_nsn: ^0.5.1
  webview_flutter: ^4.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/nexxchat.png
    - assets/material.png
    - assets/wechat.png
    - assets/alipay.jpg
    - assets/audios/
    - assets/