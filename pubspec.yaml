name: nexxchat_firebase
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  shared_preferences: ^2.2.2
  firebase_storage: 13.0.3
  modal_progress_hud_nsn: ^0.5.1
  webview_flutter: ^4.0.7
  http: ^1.1.0
  image_picker: ^0.8.7
  image: ^4.1.1
  intl: ^0.20.2
  flame: ^1.4.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

l10n:
  arb-dir: lib/apps/flutter-tetris/l10n
  template-arb-file: intl_en.arb
  output-dir: lib/apps/flutter-tetris/generated
  output-localization-file: l10n.dart
  output-class: S
  synthetic-package: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - images/nexxchat.png
    - assets/material.png
    - assets/wechat.png
    - assets/alipay.jpg
    - assets/audios/
    - assets/